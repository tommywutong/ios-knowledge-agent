[project]
name = "ioskb"
version = "0.1.0"
description = "iOS 知识库问答 agent：本地混合检索 + DeepSeek 生成，回答带出处"
requires-python = ">=3.11"
dependencies = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "jieba>=0.42.1",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
]

[project.scripts]
ioskb = "ioskb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ioskb"]
